name: Dev Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build image and deploy to dev
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/analytics
      IMAGE_TAG: dev
      NAMESPACE: dev
      KUBECONFIG: /tmp/kubeconfig
      MANIFEST_PATH: k8s/manifest-dev.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug repository tree
        run: |
          pwd
          find . -maxdepth 3 -type f | sort
          find . -maxdepth 3 -type d | sort
          test -d cmd/analytics
          test -f cmd/analytics/main.go

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Prepare kubeconfig
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Ensure dev namespace exists
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create namespace "$NAMESPACE" --dry-run=client -o yaml | \
            kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Create or update analytics env Secret
        env:
          CLICKHOUSE_DSN: ${{ vars.CLICKHOUSE_DSN }}
          KAFKA_BOOTSTRAP: ${{ vars.KAFKA_BOOTSTRAP }}
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic analytics-env \
            --namespace "$NAMESPACE" \
            --from-literal=CLICKHOUSE_DSN="$CLICKHOUSE_DSN" \
            --from-literal=KAFKA_BOOTSTRAP="$KAFKA_BOOTSTRAP" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Create or update Docker Hub pull secret
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret docker-registry docker-hub-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server="https://index.docker.io/v1/" \
            --docker-username="$DOCKER_HUB_USERNAME" \
            --docker-password="$DOCKER_HUB_TOKEN" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply dev manifests
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/analytics analytics="${IMAGE_NAME}:${IMAGE_TAG}" --namespace "$NAMESPACE"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/analytics --namespace "$NAMESPACE"

      - name: Wait for rollout
        run: kubectl --kubeconfig "$KUBECONFIG" rollout status deployment/analytics --namespace "$NAMESPACE" --timeout=180s

      - name: Health check
        run: |
          POD="$(kubectl --kubeconfig "$KUBECONFIG" get pod -l app=analytics,environment=dev --namespace "$NAMESPACE" -o jsonpath='{.items[0].metadata.name}')"
          kubectl --kubeconfig "$KUBECONFIG" wait --for=condition=Ready "pod/$POD" --namespace "$NAMESPACE" --timeout=180s
          kubectl --kubeconfig "$KUBECONFIG" logs --tail=50 "$POD" --namespace "$NAMESPACE"
